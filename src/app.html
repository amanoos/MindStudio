<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script nonce="%sveltekit.nonce%">
      try {
        var root = document.documentElement
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') root.dataset.theme = t
        var m = localStorage.getItem('motion')
        if (m === 'reduce' || m === 'full') root.dataset.motion = m
        var sizes = { small: 0.9, large: 1.15, xlarge: 1.3 }
        var z = localStorage.getItem('textSize')
        if (z && sizes[z]) root.style.setProperty('--text-scale', sizes[z])
      } catch (e) {}
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
